# Telemetry routes for a public nginx service (for example your site) in front of a PRIVATE
# collector, ClickHouse and object store. Install as /etc/nginx/templates/default.conf.template
# in the official nginx image with ENV NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1, so ${...} below is
# filled from the service env (set from service("...").hostname() in the deploy file).
#
# Hexclave runs on Fly: the client's address is the Fly-Client-IP header, and private service
# hostnames (*.flycast) resolve to IPv6 only, so the resolver needs ipv6=on. Resolving per
# request (resolver + set $var) keeps nginx starting even while a peer is down.

limit_req_zone $http_fly_client_ip zone=otel:10m rate=20r/s;
limit_req_zone $http_fly_client_ip zone=replay:10m rate=5r/s;
# One budget for every client together: the per-IP zone alone lets many clients (or one with
# many IPs) fill the replay volume. 20 chunks/s is ~200 concurrent recorders; size it to yours.
limit_req_zone $server_port zone=replay_all:64k rate=20r/s;
limit_req_zone $http_fly_client_ip zone=reader:1m rate=5r/s;
limit_req_status 429;

map "$http_x_clickhouse_user:$remote_user" $ch_auth_ok {
  "reader:" 1;
  "~^:reader$" 1;
  default 0;
}
map $remote_user $ch_authorization {
  "~^reader$" $http_authorization;
  default "";
}
map $time_iso8601 $replay_day {
  "~^([0-9]{4}-[0-9]{2}-[0-9]{2})T" "$1";
}

server {
  listen 8080;

  # Same-origin OTLP/HTTP logs from the browser: no CORS, no token in the page. Incoming headers
  # are dropped; the collector reads the client IP from X-Real-IP (include_metadata: true).
  location = /otel/v1/logs {
    limit_except POST { deny all; }
    limit_req zone=otel burst=60 nodelay;
    client_max_body_size 512k;
    client_body_buffer_size 512k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $otel ${TELEMETRY_COLLECTOR_HOST};
    proxy_pass http://$otel:4318/v1/logs;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header X-Real-IP $http_fly_client_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  # rrweb chunks, PUT straight into a SeaweedFS filer bucket, one object per chunk.
  location ~ "^/otel/replay/(?<replay_session>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/(?<replay_seq>[0-9]{1,6})\.(?<replay_ext>json|json\.gz)$" {
    limit_except POST PUT { deny all; }
    limit_req zone=replay burst=20 nodelay;
    limit_req zone=replay_all burst=40 nodelay;
    client_max_body_size 2m;
    client_body_buffer_size 2m;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $objects ${TELEMETRY_OBJECTS_HOST};
    proxy_method PUT;
    proxy_pass http://$objects:8888/buckets/replays/$replay_day/$replay_session/$replay_seq.$replay_ext;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type application/octet-stream;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  location /otel/ {
    return 404;
  }

  # Read-only SQL for scripts and agents: reader only (header or Basic auth), no ?user=/?password=.
  # Map /_ch too: a 301 to /_ch/ makes clients retry the POST as a bodyless GET.
  location = /_ch {
    rewrite ^ /_ch/ last;
  }
  location ^~ /_ch/ {
    limit_except GET POST { deny all; }
    limit_req zone=reader burst=20 nodelay;
    if ($ch_auth_ok = 0) { return 403; }
    if ($arg_user) { return 403; }
    if ($arg_password) { return 403; }
    client_max_body_size 64m;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $ch ${TELEMETRY_CLICKHOUSE_HOST};
    rewrite ^/_ch/(.*)$ /$1 break;
    proxy_pass http://$ch:8123;
    proxy_set_header Host $ch;
    proxy_set_header Authorization $ch_authorization;
    proxy_set_header Cookie "";
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }

  # Replay reads (player, dashboard) behind a bearer token.
  location ^~ /_replays/ {
    limit_except GET { deny all; }
    limit_req zone=reader burst=40;
    if ($http_authorization != "Bearer ${TELEMETRY_REPLAYS_READ_TOKEN}") { return 401; }
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $objects ${TELEMETRY_OBJECTS_HOST};
    rewrite ^/_replays/(.*)$ /buckets/replays/$1 break;
    proxy_pass http://$objects:8888;
    proxy_pass_request_headers off;
    proxy_set_header Accept $http_accept;
  }
}
